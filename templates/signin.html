<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Intrusion Detection - Login</title>
    <link rel="stylesheet" href="../static/css/auth-forms.css" />
    <!-- Font Awesome CDN link for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
    <div class="wrapper">
        <div class="title">
            <i class="fas fa-shield-alt"></i>
            <span>IoT Security Login</span>
        </div>
        <form action="/signin" method="post">
            {% if message %}
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                {{ message }}
            </div>
            {% endif %}
            
            <div class="row">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Username" required name="user" />
            </div>
            <div class="row">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Password" required name="password" />
            </div>
            <div class="row button">
                <input type="submit" value="Sign In" />
            </div>
            <div class="signup-link">Not a member? <a href="/logon">Sign up now</a></div>
        </form>
    </div>
</body>
</html>
